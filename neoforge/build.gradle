plugins {
    id 'net.neoforged.moddev' version "${neo_moddev_version}"
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-neoforge"
}

sourceSets {
    main {
        java {
            srcDir '../common/src/main/java'
        }
        resources {
            srcDir '../common/src/main/resources'
        }
    }
}

neoForge {
    version = project.property('neoforge_version') as String

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }

        server {
            server()
            gameDirectory = project.file('run')
        }
    }

    mods {
        register(project.property('mod_id') as String) {
            sourceSet(sourceSets.main)
        }
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
            version: project.version,
            mod_id: project.property('mod_id'),
            mod_name: project.property('mod_name')
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
