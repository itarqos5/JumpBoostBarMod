name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all subprojects
        run: ./gradlew build --no-daemon

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: jumpboostbar-fabric
          path: fabric/build/libs/*.jar
          if-no-files-found: warn

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: jumpboostbar-neoforge
          path: neoforge/build/libs/*.jar
          if-no-files-found: warn

      - name: Upload Paper jar
        uses: actions/upload-artifact@v4
        with:
          name: jumpboostbar-paper
          path: paper/build/libs/*.jar
          if-no-files-found: warn

      - name: Upload Universal jar
        uses: actions/upload-artifact@v4
        with:
          name: jumpboostbar-universal
          path: build/libs/*.jar
          if-no-files-found: warn
